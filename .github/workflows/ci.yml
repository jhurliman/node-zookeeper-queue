name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    services:
      zookeeper:
        image: zookeeper:3.9
        ports:
          - 2181/tcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm run test:integration
        env:
          ZK_TEST_PORT: ${{ job.services.zookeeper.ports[2181] }}
      - run: npm pack --dry-run
